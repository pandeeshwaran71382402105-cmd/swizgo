<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swigzo – Food delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf6;--surface:#fff;--ink:#1c211e;--mute:#6a726d;--line:#e6e4dc;--accent:#0b8a4d;--accent-ink:#fff;--warn:#f2a900;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101412;--surface:#1a201d;--ink:#eef2ee;--mute:#9aa49e;--line:#2c3430;--accent:#34c47c;--accent-ink:#06150d}}
:root[data-theme="dark"]{--bg:#101412;--surface:#1a201d;--ink:#eef2ee;--mute:#9aa49e;--line:#2c3430;--accent:#34c47c;--accent-ink:#06150d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{font-weight:800;font-size:26px;color:var(--accent)}
.loc{font-size:14px;color:var(--mute);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc b{color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.notice{font-size:13px;color:var(--mute);text-align:center;padding:8px 20px;border-bottom:1px solid var(--line)}
.hero{padding:44px 0 20px}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.02;margin:0 0 10px;font-weight:800;max-width:14ch}
.hero p{color:var(--mute);margin:0 0 22px;font-size:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input[type=search]{flex:1 1 260px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.bar select{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:26px;margin:28px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.rest{background:var(--surface);border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid var(--line);text-align:left;padding:0;display:block;width:100%}
.rest:hover{border-color:var(--accent)}
.pic{height:130px;display:grid;place-items:center;font-size:58px;position:relative}
.offer{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:13px;font-weight:700;padding:16px 12px 8px;text-align:left}
.rest .in{padding:12px 14px 14px}
.rest h3{margin:0;font-size:18px}
.meta{display:flex;gap:10px;font-size:14px;margin:4px 0;align-items:center}
.star{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px;font-weight:700;font-size:13px}
.cu{color:var(--mute);font-size:13px}
.veg{display:inline-block;width:14px;height:14px;border:2px solid #1a9a46;border-radius:3px;position:relative;vertical-align:middle}
.veg::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#1a9a46}
.veg.nv{border-color:#c4302b}.veg.nv::after{background:#c4302b}
.empty{grid-column:1/-1;color:var(--mute);padding:20px 0}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,94vw);max-height:88vh;background:var(--surface);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{padding:22px 24px 12px;position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.dh h3{margin:0;font-size:24px}
.x{background:none;border:0;font-size:26px;cursor:pointer;line-height:1;color:var(--mute)}
.db{padding:8px 24px 22px}
.item{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{display:block}.item small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px}
.qty button{background:none;border:0;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--accent);font-weight:700}
.qty span{min-width:20px;text-align:center;font-weight:700}
.row{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.row.t{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 4px}
.db input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.steps{list-style:none;padding:0;margin:18px 0}
.steps li{display:flex;gap:12px;align-items:center;padding:9px 0;color:var(--mute)}
.steps li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.on{color:var(--ink);font-weight:700}.steps li.on i{background:var(--accent);border-color:var(--accent)}
#cartbtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 8px 24px rgba(0,0,0,.25);padding:14px 20px;border-radius:16px;display:none;z-index:6}
footer{padding:36px 0 90px;color:var(--mute);font-size:13px;border-top:1px solid var(--line);margin-top:36px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><span class="logo">swigzo</span><span class="loc">Deliver to <b id="loc">Home</b></span><button class="btn ghost" id="locbtn">Change</button></div></header>
<div class="notice">Demo site. Restaurants are made up and orders are simulated.</div>

<main class="wrap">
<section class="hero"><h1>Hungry? Order in minutes.</h1><p>Pick a restaurant, build your order and watch it arrive.</p>
<div class="bar"><input id="q" type="search" placeholder="Search restaurants or dishes" aria-label="Search restaurants or dishes">
<select id="sort" aria-label="Sort"><option value="r">Top rated</option><option value="t">Fastest delivery</option></select>
<button class="chip" id="vegOnly" aria-pressed="false">Veg only</button></div>
<div class="chips" id="chips"></div></section>
<h2 id="count">Restaurants near you</h2>
<div class="grid" id="grid"></div>
</main>
<footer><div class="wrap">Swigzo · Food delivery prototype. Prices include GST in this demo.</div></footer>

<button class="btn" id="cartbtn"></button>
<dialog id="dlg"></dialog>

<script>
const R=[
{n:"Biryani Junction",cu:"Biryani, Mughlai",r:4.4,t:32,o:"20% off up to ₹80",e:"🍛",bg:"#f7d9b5",m:[["Chicken dum biryani",240,0],["Veg biryani",190,1],["Mutton biryani",320,0],["Raita",40,1]]},
{n:"Dosa Corner",cu:"South Indian",r:4.5,t:22,o:"Free delivery",e:"🥞",bg:"#f4e6b0",m:[["Masala dosa",90,1],["Ghee roast",110,1],["Idli (3 pcs)",60,1],["Filter coffee",35,1]]},
{n:"Pizza Piazza",cu:"Pizza, Italian",r:4.2,t:35,o:"Buy 1 get 1",e:"🍕",bg:"#f9c9c0",m:[["Margherita",249,1],["Pepperoni",349,0],["Garlic bread",129,1],["Cold coffee",99,1]]},
{n:"Wok Wonders",cu:"Chinese, Asian",r:4.1,t:28,o:"₹100 off above ₹399",e:"🍜",bg:"#cfe6d2",m:[["Veg hakka noodles",160,1],["Chicken fried rice",190,0],["Manchurian",150,1],["Spring rolls",120,1]]},
{n:"Burger Barn",cu:"Burgers, Fast food",r:4.3,t:25,o:"30% off",e:"🍔",bg:"#fbe0a8",m:[["Classic veg burger",129,1],["Chicken burger",179,0],["Fries",89,1],["Choco shake",119,1]]},
{n:"Meals on Time",cu:"North Indian, Thali",r:4.0,t:30,o:"Free dessert",e:"🍱",bg:"#e3d6f2",m:[["Veg thali",180,1],["Paneer butter masala",210,1],["Butter chicken",260,0],["Garlic naan",45,1]]},
{n:"Sweet Tooth",cu:"Desserts, Bakery",r:4.6,t:20,o:"15% off",e:"🍰",bg:"#f8d0e0",m:[["Chocolate truffle slice",120,1],["Brownie",90,1],["Gulab jamun (2)",70,1],["Ice cream tub",160,1]]},
{n:"Healthy Bowl",cu:"Salads, Healthy",r:4.3,t:24,o:"Free delivery",e:"🥗",bg:"#d3ecc8",m:[["Greek salad",180,1],["Grilled chicken bowl",250,0],["Quinoa veg bowl",210,1],["Fresh lime soda",60,1]]}];
const $=s=>document.querySelector(s),dlg=$("#dlg");
let cart={},rid=null,cuisine="All",veg=false,loc="Home";
const cuisines=["All",...new Set(R.flatMap(x=>x.cu.split(", ")))];
$("#chips").innerHTML=cuisines.map(c=>`<button class="chip" aria-pressed="${c==="All"}" data-c="${c}">${c}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;cuisine=b.dataset.c;document.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()};
$("#vegOnly").onclick=e=>{veg=!veg;e.currentTarget.setAttribute("aria-pressed",veg);draw()};
$("#q").oninput=draw;$("#sort").onchange=draw;
$("#locbtn").onclick=()=>{const v=prompt("Delivery address label (e.g. Home, Office)",loc);if(v){loc=v.trim().slice(0,30)||loc;$("#loc").textContent=loc}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function draw(){
 const q=$("#q").value.trim().toLowerCase();
 let l=R.map((x,i)=>({...x,i})).filter(x=>(cuisine==="All"||x.cu.includes(cuisine))&&(!veg||x.m.some(m=>m[2]))&&(!q||(x.n+x.cu+x.m.map(m=>m[0]).join()).toLowerCase().includes(q)));
 l.sort($("#sort").value==="t"?(a,b)=>a.t-b.t:(a,b)=>b.r-a.r);
 $("#count").textContent=l.length+" restaurants near you";
 $("#grid").innerHTML=l.length?l.map(x=>`<button class="rest" data-i="${x.i}"><div class="pic" style="background:${x.bg}">${x.e}<div class="offer">${x.o}</div></div><div class="in"><h3>${x.n}</h3><div class="meta"><span class="star">★ ${x.r}</span><span>${x.t} mins</span></div><div class="cu">${x.cu}</div></div></button>`).join(""):`<p class="empty">Nothing matches. Clear the search or choose All.</p>`;
}
$("#grid").onclick=e=>{const b=e.target.closest("[data-i]");if(b)openRest(+b.dataset.i)};
const key=(r,k)=>r+"|"+k;
function openRest(i){rid=i;const x=R[i];
 dlg.innerHTML=`<div class="dh"><div><h3>${x.n}</h3><span class="cu">${x.cu} · ${x.t} mins</span></div><button class="x" aria-label="Close" onclick="dlg.close()">×</button></div><div class="db" id="menu"></div>`;
 menu();if(!dlg.open)dlg.showModal();}
function menu(){const x=R[rid];$("#menu").innerHTML=x.m.map((m,k)=>{const q=cart[key(rid,k)]||0;
 return `<div class="item"><div><span class="veg ${m[2]?"":"nv"}"></span> <b style="display:inline">${m[0]}</b><small>₹${m[1]}</small></div>${q?`<div class="qty"><button onclick="chg(${k},-1)" aria-label="Remove one">−</button><span>${q}</span><button onclick="chg(${k},1)" aria-label="Add one">+</button></div>`:`<button class="btn ghost" onclick="chg(${k},1)">Add</button>`}</div>`}).join("");}
function chg(k,d){const s=key(rid,k);cart[s]=Math.max(0,(cart[s]||0)+d);if(!cart[s])delete cart[s];menu();bar()}
function lines(){return Object.entries(cart).map(([s,q])=>{const[r,k]=s.split("|");const x=R[r],m=x.m[k];return{s,r:+r,x,m,q}})}
function bar(){const L=lines(),n=L.reduce((a,l)=>a+l.q,0),b=$("#cartbtn");b.style.display=n?"block":"none";b.textContent=`View cart · ${n} item${n>1?"s":""} · ₹${L.reduce((a,l)=>a+l.q*l.m[1],0)}`}
$("#cartbtn").onclick=openCart;
function openCart(){const L=lines();if(!L.length)return;
 const sub=L.reduce((a,l)=>a+l.q*l.m[1],0),fee=sub>=299?0:39,tax=Math.round(sub*.05),tot=sub+fee+tax;
 dlg.innerHTML=`<div class="dh"><h3>Your cart</h3><button class="x" aria-label="Close" onclick="dlg.close()">×</button></div><div class="db">
 ${L.map(l=>`<div class="item"><div><b>${l.m[0]}</b><small>${l.x.n} · ₹${l.m[1]}</small></div><div class="qty"><button onclick="cq('${l.s}',-1)" aria-label="Remove one">−</button><span>${l.q}</span><button onclick="cq('${l.s}',1)" aria-label="Add one">+</button></div></div>`).join("")}
 <div style="margin-top:14px"><div class="row"><span>Item total</span><span>₹${sub}</span></div><div class="row"><span>Delivery fee${fee?"":" (free above ₹299)"}</span><span>₹${fee}</span></div><div class="row"><span>Taxes</span><span>₹${tax}</span></div><div class="row t"><span>To pay</span><span>₹${tot}</span></div></div>
 <label for="nm">Name</label><input id="nm" autocomplete="name"><label for="ad">Delivery address</label><input id="ad" autocomplete="street-address" placeholder="Flat, street, area">
 <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn ghost" onclick="dlg.close()">Add more</button><button class="btn" onclick="place(${tot})">Place order</button></div></div>`;
 if(!dlg.open)dlg.showModal()}
function cq(s,d){cart[s]+=d;if(cart[s]<=0)delete cart[s];bar();Object.keys(cart).length?openCart():dlg.close()}
function place(tot){const nm=$("#nm").value.trim(),ad=$("#ad").value.trim();
 if(!nm||!ad){alert("Enter your name and delivery address to place the order.");return}
 const id="SWZ"+Math.floor(1000+Math.random()*9000);cart={};bar();
 const S=["Order confirmed","Restaurant is preparing your food","Out for delivery","Delivered. Enjoy your meal!"];
 dlg.innerHTML=`<div class="dh"><div><h3>Order ${id}</h3><span class="cu">₹${tot} · Pay on delivery</span></div></div><div class="db"><p>Delivering to <b>${esc(nm)}</b>, ${esc(ad)}</p><ol class="steps" id="st">${S.map(s=>`<li><i></i>${s}</li>`).join("")}</ol><div style="text-align:right"><button class="btn" id="done" disabled>Done</button></div></div>`;
 const li=[...document.querySelectorAll("#st li")];let n=1;
 li[0].classList.add("on");
 const t=setInterval(()=>{li[n].classList.add("on");n++;if(n>=li.length){clearInterval(t);$("#done").disabled=false}},1500);
 $("#done").onclick=()=>dlg.close()}
dlg.addEventListener("click",e=>{if(e.target===dlg&&dlg.querySelector("#done")===null)dlg.close()});
draw();
</script>
</body>
</html>
